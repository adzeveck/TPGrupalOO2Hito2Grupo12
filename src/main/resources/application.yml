
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/epicentrogourmet
    username: root
    password: "1999"

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  thymeleaf:
    cache: false

  # Configuración del servicio de correo
  mail:
    host: ${MAIL_HOST:smtp-mail.outlook.com}
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
