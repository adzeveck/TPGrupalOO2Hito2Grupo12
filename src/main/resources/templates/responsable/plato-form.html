<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="mb-1" th:text="${edicion} ? 'Modificar plato' : 'Nuevo plato'">Nuevo plato</h1>
    <p class="text-muted mb-4">El plato queda en el menú de tu unidad.</p>

    <!-- novalidate: valida el servidor, así todos los errores se muestran igual al lado de su campo -->
    <form class="card card-body mb-4" novalidate th:object="${plato}"
          th:action="${edicion} ? @{/responsable/platos/{id}(id=${plato.id})} : @{/responsable/platos}"
          method="post">
        <!-- En la edición el id viaja oculto para poder volver al mismo formulario si hay errores -->
        <input type="hidden" th:if="${edicion}" th:field="*{id}"/>
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" maxlength="100"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"/>
            <small class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
        </div>

        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="precio">Precio de venta</label>
                <input type="number" step="0.01" min="0" class="form-control" id="precio" th:field="*{precio}"
                       th:classappend="${#fields.hasErrors('precio') or #fields.hasErrors('precioMayorAlCosto')} ? 'is-invalid'"/>
                <small class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></small>
            </div>
            <div class="form-group col-md-6">
                <label for="costo">Costo de producción</label>
                <input type="number" step="0.01" min="0" class="form-control" id="costo" th:field="*{costo}"
                       th:classappend="${#fields.hasErrors('costo') or #fields.hasErrors('precioMayorAlCosto')} ? 'is-invalid'"/>
                <small class="text-danger" th:if="${#fields.hasErrors('costo')}" th:errors="*{costo}"></small>
            </div>
        </div>
        <small class="text-danger d-block mb-3" th:if="${#fields.hasErrors('precioMayorAlCosto')}"
               th:errors="*{precioMayorAlCosto}">Error</small>

        <div>
            <button type="submit" class="btn btn-primary" th:text="${edicion} ? 'Guardar cambios' : 'Crear plato'">Crear plato</button>
            <a class="btn btn-link" th:href="@{/responsable/platos}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
