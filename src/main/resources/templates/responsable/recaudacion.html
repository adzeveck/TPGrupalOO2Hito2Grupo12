<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="mb-1">Reporte de recaudación</h1>
    <p class="text-muted mb-4">Lo que vendió tu unidad en el festival.</p>

    <div th:if="${errorGeneral != null}">
        <div class="alert alert-warning" th:text="${errorGeneral}">Mensaje</div>
        <a class="btn btn-secondary" th:href="@{/responsable/index}">Volver al panel</a>
    </div>

    <div class="card" th:if="${reporte != null}">
        <div class="card-header">
            <span th:text="${reporte.nombreComercial}">Unidad</span>
            <span class="text-muted" th:text="'(' + ${reporte.codigo} + ')'">(FT00000001)</span> ·
            <span th:text="${festival.nombre}">Festival</span>
        </div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between">
                <span>Pedidos</span>
                <strong th:text="${reporte.cantidadPedidos}">0</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between">
                <span>Recaudación de tu unidad</span>
                <strong th:text="'$ ' + ${#numbers.formatDecimal(reporte.recaudacion, 1, 'POINT', 2, 'COMMA')}">$ 0,00</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between text-muted">
                <span>Recaudación total del festival (todas las unidades)</span>
                <span th:text="'$ ' + ${#numbers.formatDecimal(totalFestival, 1, 'POINT', 2, 'COMMA')}">$ 0,00</span>
            </li>
        </ul>
    </div>

    <a class="btn btn-link px-0 mt-3" th:href="@{/responsable/index}">Volver al panel</a>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
