<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header mb-4">
            <h2>Mi unidad de venta</h2>
            <p class="text-muted mb-0">Sesión iniciada como <strong sec:authentication="name">usuario</strong></p>
        </div>

        <div class="card">
            <div class="card-header">Acciones del responsable</div>
            <div class="list-group list-group-flush">
                <span class="list-group-item">Empleados: alta, baja, modificación y filtros</span>
                <span class="list-group-item">Alta de platos</span>
                <a class="list-group-item list-group-item-action" th:href="@{/responsable/canon}">
                    Canon de la unidad
                </a>
                <span class="list-group-item">Liquidación de haberes</span>
                <span class="list-group-item">Reporte de recaudación</span>
                <span class="list-group-item">Rentabilidad neta (total y entre dos fechas)</span>
                <span class="list-group-item">Plato estrella</span>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
