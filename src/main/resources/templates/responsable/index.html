<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header mb-4">
            <h2>Mi unidad de venta</h2>
            <p class="text-muted mb-0">Sesión iniciada como <strong sec:authentication="name">usuario</strong></p>
        </div>

        <div class="card">
            <div class="card-header">Acciones del responsable</div>
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action" th:href="@{/responsable/platos}">
                    Mis platos: alta, modificación y baja
                </a>
                <a class="list-group-item list-group-item-action" th:href="@{/responsable/canon}">
                    Canon de la unidad
                </a>
                <a class="list-group-item list-group-item-action" th:href="@{/responsable/plato-estrella}">
                    Plato estrella
                </a>
                <a class="list-group-item list-group-item-action" th:href="@{/responsable/empleados}">
                    Empleados: alta, modificación, baja, reactivación y filtros
                </a>
                <a class="list-group-item list-group-item-action" th:href="@{/responsable/recaudacion}">
                    Reporte de recaudación
                </a>
                <a class="list-group-item list-group-item-action" th:href="@{/responsable/recaudacion/diaria}">
                    Recaudación por día
                </a>
                <a class="list-group-item list-group-item-action" th:href="@{/responsable/rentabilidad}">
                    Rentabilidad neta (total y entre dos fechas)
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
