<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="mb-1">Nuevo pedido</h1>

    <!-- Error general: no es cajero, no tiene unidad o no hay festival activo hoy -->
    <div th:if="${errorGeneral != null}">
        <div class="alert alert-warning mt-3" th:text="${errorGeneral}">Mensaje</div>
        <a class="btn btn-secondary" th:href="@{/empleado/index}">Volver</a>
    </div>

    <div th:if="${errorGeneral == null}">
        <p class="text-muted mb-4">
            <span th:text="${unidad.nombreComercial}">Unidad</span> ·
            Fecha del pedido: <strong th:text="${#temporals.format(hoy, 'dd/MM/yyyy')}">18/10/2026</strong>
            (siempre es la de hoy)
        </p>

        <form th:action="@{/empleado/pedidos}" th:object="${pedido}" method="post" novalidate>

            <!-- Errores del pedido: ningún plato cargado, plato no disponible, cantidad inválida -->
            <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                <div th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</div>
            </div>

            <div class="card mb-4">
                <div class="card-header"><strong>Platos del menú</strong></div>
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th>Plato</th>
                                <th class="text-right">Precio</th>
                                <th style="width: 9rem">Cantidad</th>
                                <th class="text-right">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item, st : *{items}">
                                <td>
                                    <span th:text="${item.nombre}">Plato</span>
                                    <!-- Vuelven con el POST para redibujar la tabla si hay errores.
                                         El service no los usa: vuelve a leer plato y precio de la base -->
                                    <input type="hidden" th:field="*{items[__${st.index}__].platoId}"/>
                                    <input type="hidden" th:field="*{items[__${st.index}__].nombre}"/>
                                    <input type="hidden" th:field="*{items[__${st.index}__].precio}"/>
                                </td>
                                <td class="text-right" th:text="'$ ' + ${#numbers.formatDecimal(item.precio, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                                <td>
                                    <input type="number" min="0" step="1" class="form-control cantidad"
                                           th:field="*{items[__${st.index}__].cantidad}"
                                           th:attr="data-precio=${item.precio}"
                                           th:classappend="${#fields.hasErrors('items[__${st.index}__].cantidad')} ? 'is-invalid'"/>
                                </td>
                                <td class="text-right subtotal">$ 0,00</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <th colspan="3" class="text-right">Total</th>
                                <th class="text-right" id="total">$ 0,00</th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Registrar pedido</button>
            <a class="btn btn-link" th:href="@{/empleado/pedidos}">Ver pedidos de hoy</a>
        </form>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

<script>
    // Subtotales y total en vivo, solo para el cajero: el total que se guarda lo calcula el servidor
    (function () {
        const formato = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const inputs = document.querySelectorAll('input.cantidad');

        function recalcular() {
            let total = 0;
            inputs.forEach(function (input) {
                const cantidad = Math.max(0, parseInt(input.value, 10) || 0);
                const subtotal = cantidad * parseFloat(input.dataset.precio);
                input.closest('tr').querySelector('.subtotal').textContent = '$ ' + formato.format(subtotal);
                total += subtotal;
            });
            const totalEl = document.getElementById('total');
            if (totalEl) { totalEl.textContent = '$ ' + formato.format(total); }
        }

        inputs.forEach(function (input) { input.addEventListener('input', recalcular); });
        recalcular(); // también al cargar: después de un error vuelve con las cantidades que había
    })();
</script>
</body>
</html>
