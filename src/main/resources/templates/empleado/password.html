<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="mb-3">Cambiar contraseña</h1>

    <div class="alert alert-success" th:if="${cambiada != null}">
        Tu contraseña se cambió correctamente.
    </div>

    <form th:action="@{/empleado/password}" th:object="${cambio}" method="post" style="max-width: 480px;">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="form-group">
            <label for="passwordActual">Contraseña actual</label>
            <input type="password" class="form-control" th:field="*{passwordActual}"
                   th:classappend="${#fields.hasErrors('passwordActual')} ? 'is-invalid'"/>
            <small class="text-danger" th:if="${#fields.hasErrors('passwordActual')}" th:errors="*{passwordActual}"></small>
        </div>

        <div class="form-group">
            <label for="passwordNueva">Nueva contraseña</label>
            <input type="password" class="form-control" th:field="*{passwordNueva}"
                   th:classappend="${#fields.hasErrors('passwordNueva')} ? 'is-invalid'"/>
            <small class="text-muted">Entre 8 y 72 caracteres.</small>
            <small class="text-danger d-block" th:if="${#fields.hasErrors('passwordNueva')}" th:errors="*{passwordNueva}"></small>
        </div>

        <div class="form-group">
            <label for="confirmarPassword">Repetir nueva contraseña</label>
            <input type="password" class="form-control" th:field="*{confirmarPassword}"
                   th:classappend="${#fields.hasErrors('confirmarPassword') or #fields.hasErrors('passwordsCoinciden')} ? 'is-invalid'"/>
            <small class="text-danger" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></small>
            <small class="text-danger" th:if="${#fields.hasErrors('passwordsCoinciden')}" th:errors="*{passwordsCoinciden}"></small>
        </div>

        <button type="submit" class="btn btn-primary">Cambiar contraseña</button>
        <a class="btn btn-link" th:href="@{/empleado/index}">Volver</a>
    </form>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
