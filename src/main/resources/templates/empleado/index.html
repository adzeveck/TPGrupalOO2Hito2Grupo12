<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header mb-4">
            <h2>Mi trabajo</h2>
            <p class="text-muted mb-0">Sesión iniciada como <strong sec:authentication="name">usuario</strong></p>
        </div>

        <!-- Solo para cajeros: el controller pasa puedeCargarPedidos (el tipo se sabe por la subclase) -->
        <div class="card mb-4" th:if="${puedeCargarPedidos}">
            <div class="card-header">Caja</div>
            <div class="card-body">
                <a class="btn btn-primary mr-2" th:href="@{/empleado/pedidos/nuevo}">Nuevo pedido</a>
                <a class="btn btn-outline-primary mr-2" th:href="@{/empleado/pedidos}">Pedidos de hoy</a>
                <a class="btn btn-outline-secondary" th:href="@{/empleado/pedidos/cierre}">Cierre de caja</a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Acciones del empleado</div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><a th:href="@{/empleado/puesto}">Mi festival y unidad de venta</a></li>
                <li class="list-group-item"><a th:href="@{/empleado/sueldo}">Mi liquidación de sueldo</a></li>
                <li class="list-group-item"><a th:href="@{/empleado/hoy}">¿Trabajo hoy?</a></li>
                <li class="list-group-item">Cajero: alta de pedido y cierre de caja</li>
            </ul>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
