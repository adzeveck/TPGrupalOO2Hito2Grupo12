<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header mb-4">
            <h2>Mi trabajo</h2>
            <p class="text-muted mb-0">Sesión iniciada como <strong sec:authentication="name">usuario</strong></p>
        </div>

        <div class="card">
            <div class="card-header">Acciones del empleado</div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item">Ver festivales y unidad donde trabajo</li>
                <li class="list-group-item">Sueldo por festival y recibo en PDF</li>
                <li class="list-group-item">¿Trabajo hoy?</li>
                <li class="list-group-item">Cajero: alta de pedido y cierre de caja</li>
            </ul>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
