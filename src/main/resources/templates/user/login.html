<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
</head>
<body class="bg-light">

    <div class="login-container">
        <div class="card login-card">
            <div class="card-body">
                <div class="login-header">
                    <h3>Epicentro Gourmet</h3>
                    <p class="text-muted">Inicie sesión para continuar</p>
                </div>

                <div th:if="${error != null}" class="alert alert-danger">
                    Usuario o contraseña inválidos.
                </div>

                <div th:if="${disabled != null}" class="alert alert-warning">
                    El usuario está dado de baja. Consulte con el responsable de su unidad.
                </div>

                <div th:if="${logout != null}" class="alert alert-success">
                    Sesión finalizada correctamente.
                </div>

                <div th:if="${registrado != null}" class="alert alert-success">
                    Unidad de venta registrada. Ya podés iniciar sesión con tu email y contraseña.
                </div>


                <form th:action="@{/loginprocess}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Email</label>
                        <input type="email" class="form-control" id="username" name="username" required autofocus placeholder="usuario@ejemplo.com"/>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Ingrese su contraseña"/>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/index}">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
