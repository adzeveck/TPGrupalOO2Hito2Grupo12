<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prueba de correo - Epicentro Gourmet</title>

    <meta th:if="${_csrf != null}"
          name="_csrf"
          th:content="${_csrf.token}">

    <meta th:if="${_csrf != null}"
          name="_csrf_header"
          th:content="${_csrf.headerName}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Prueba de envío de correo</h4>
                </div>

                <div class="card-body">
                    <p>
                        Enviá un correo de prueba desde Epicentro Gourmet.
                    </p>

                    <form id="emailForm">
                        <div class="form-group">
                            <label for="destinatario">
                                Correo del destinatario
                            </label>

                            <input
                                    type="email"
                                    class="form-control"
                                    id="destinatario"
                                    name="destinatario"
                                    placeholder="destinatario@ejemplo.com"
                                    required>
                        </div>

                        <button
                                type="submit"
                                class="btn btn-primary"
                                id="enviar">
                            Enviar correo de prueba
                        </button>

                        <a th:href="@{/}" class="btn btn-secondary">
                            Volver al inicio
                        </a>
                    </form>

                    <div id="resultado"
                         class="alert mt-3"
                         role="status"
                         aria-live="polite"
                         hidden>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: scripts}"></div>

<script>
    const form = document.getElementById("emailForm");
    const resultado = document.getElementById("resultado");
    const boton = document.getElementById("enviar");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const destinatario =
            document.getElementById("destinatario").value.trim();

        const parametros = new URLSearchParams();
        parametros.set("destinatario", destinatario);

        const headers = {
            "Content-Type":
                "application/x-www-form-urlencoded;charset=UTF-8"
        };

        const csrfToken =
            document.querySelector('meta[name="_csrf"]')?.content;

        const csrfHeader =
            document.querySelector('meta[name="_csrf_header"]')?.content;

        if (csrfToken && csrfHeader) {
            headers[csrfHeader] = csrfToken;
        }

        boton.disabled = true;
        resultado.hidden = false;
        resultado.className = "alert alert-info mt-3";
        resultado.textContent = "Enviando correo...";

        try {
            const respuesta = await fetch("/api/test-email", {
                method: "POST",
                headers: headers,
                body: parametros.toString()
            });

            const mensaje = await respuesta.text();

            resultado.className =
                "alert mt-3 " +
                (respuesta.ok ? "alert-success" : "alert-danger");

            resultado.textContent = respuesta.ok
                ? mensaje
                : "Error (" + respuesta.status + "): " + mensaje;

        } catch (error) {
            resultado.className = "alert alert-danger mt-3";
            resultado.textContent =
                "No se pudo conectar con el servidor Spring Boot. " +
                "Verificá que la aplicación esté ejecutándose en el puerto 8080.";
        } finally {
            boton.disabled = false;
        }
    });
</script>
</body>
</html>
