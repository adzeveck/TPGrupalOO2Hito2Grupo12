<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="mb-1">Unidades con mayor canon</h1>
    <p class="text-muted mb-4">Top de unidades de un festival ordenado por el canon que pagan.</p>

    <p class="alert alert-info" th:if="${#lists.isEmpty(festivales)}">
        Todavía no hay festivales cargados.
    </p>

    <form class="card card-body mb-4" method="get" th:action="@{/admin/canon}" th:if="${!#lists.isEmpty(festivales)}">
        <div class="form-row align-items-end">
            <div class="form-group col-md-8 mb-md-0">
                <label for="festivalId">Festival</label>
                <select class="form-control" id="festivalId" name="festivalId">
                    <option th:each="festival : ${festivales}" th:value="${festival.id}"
                            th:data-unidades="${#lists.size(festival.unidades)}"
                            th:selected="${festivalId != null and festival.id == festivalId}"
                            th:text="|${festival.nombre} (${festival.temporada})|">Festival</option>

                </select>
            </div>
            <div class="form-group col-md-2 mb-md-0">
                <label for="limite">Cantidad (x)</label>
                <input type="number" class="form-control" id="limite" name="limite" min="1"
                       th:max="${maximo > 0 ? maximo : null}"
                       th:value="${limite > 0 ? limite : null}"/>
                <small class="form-text text-muted" id="ayudaLimite"
                       th:text="${maximo > 0 ? 'Entre 1 y ' + maximo : 'Sin unidades'}">Entre 1 y 4</small>

            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary btn-block">Ver ranking</button>
            </div>
        </div>
    </form>

    <div class="alert alert-warning" th:if="${errorGeneral != null}" th:text="${errorGeneral}">Mensaje</div>

    <div th:if="${reporte != null}">
        <p class="text-muted" th:if="${#lists.isEmpty(reporte)}">El festival no tiene unidades de venta.</p>

        <div class="card" th:unless="${#lists.isEmpty(reporte)}">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre comercial</th>
                            <th>Código</th>
                            <th>Tipo</th>
                            <th class="text-right">Canon</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="unidad, st : ${reporte}">
                            <td th:text="${st.count}">1</td>
                            <td th:text="${unidad.nombreComercial}">Unidad</td>
                            <td th:text="${unidad.codigo}">FT00000001</td>
                            <td th:text="${unidad.tipo}">Tipo</td>
                            <td class="text-right"
                                th:text="'$ ' + ${#numbers.formatDecimal(unidad.canon, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

<script>
    // Al cambiar de festival, el máximo de la x pasa a ser la cantidad de unidades de ese festival
    const selectFestival = document.getElementById('festivalId');
    const campoLimite = document.getElementById('limite');
    const ayudaLimite = document.getElementById('ayudaLimite');
    if (selectFestival && campoLimite) {
        selectFestival.addEventListener('change', function () {
            const unidades = Number(this.selectedOptions[0].dataset.unidades);
            if (unidades > 0) {
                campoLimite.max = unidades;
                if (!campoLimite.value || Number(campoLimite.value) > unidades) {
                    campoLimite.value = Math.min(5, unidades);
                }
                ayudaLimite.textContent = 'Entre 1 y ' + unidades;
            } else {
                campoLimite.removeAttribute('max');
                campoLimite.value = '';
                ayudaLimite.textContent = 'Sin unidades';
            }
        });
    }
</script>


</body>
</html>
