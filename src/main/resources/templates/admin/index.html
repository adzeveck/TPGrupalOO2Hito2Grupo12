<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header mb-4">
            <h2>Administración</h2>
            <p class="text-muted mb-0">Sesión iniciada como <strong sec:authentication="name">usuario</strong></p>
        </div>

        <div class="card mb-4">
            <div class="card-header">Acciones del administrador</div>
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action" th:href="@{/admin/festivales}">
                    Ver festivales
                </a>
                <a class="list-group-item list-group-item-action" th:href="@{/admin/festivales}">
                    Ver unidades de venta de un festival
                </a>
                <a class="list-group-item list-group-item-action" th:href="@{/admin/canon}">
                    Unidades con mayor canon
                </a>
                <a class="list-group-item list-group-item-action" th:href="@{/admin/recaudacion}">
                    Ranking de unidades por recaudación
                </a>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">Prueba de correo electrónico</h5>
                <p class="card-text">
                    Comprobá el envío de correos desde la aplicación.
                </p>

                <a th:href="@{/admin/emailTest}" class="btn btn-primary">
                    Probar envío de correo
                </a>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
